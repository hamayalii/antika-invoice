# ---------------------------------------------------------------------------
# Host-level nginx for Antika Docs (VPS).
#
# 1. Replace docs.example.com with your real subdomain.
# 2. Copy to /etc/nginx/sites-available/antika-docs.conf
# 3. ln -s /etc/nginx/sites-available/antika-docs.conf /etc/nginx/sites-enabled/
# 4. nginx -t && systemctl reload nginx
#
# The Docker "web" container listens on 127.0.0.1:8080 and reverse-proxies
# /api to the API container. This host block only terminates TLS.
#
# Obtain the certificate after the HTTP block is live:
#   certbot certonly --webroot -w /var/www/certbot -d docs.example.com
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name docs.example.com;

    # Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.example.com;

    ssl_certificate     /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;

    # PDF rendering can take a few seconds on a small VPS.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
