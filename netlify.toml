[build]
  command = "npm --workspace @antika/shared run build && npm --workspace @antika/web run build"
  publish = "apps/web/dist"

# Proxy API calls to the Railway backend so auth cookies (SameSite=Strict) stay first-party.
[[redirects]]
  from = "/api/*"
  to = "https://antika-invoice-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
